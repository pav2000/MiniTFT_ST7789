name=MiniTFT
version=1.0.0
author=ArduinoLab project
maintainer=ArduinoLab project
sentence=Minimal SPI driver for ST7789 240x240 displays without Adafruit_GFX/BusIO.
paragraph=Compact alternative to Adafruit_GFX + Adafruit_ST7789 + Adafruit_BusIO for flash-constrained boards (e.g. ATmega328/Uno). Supports fillRect/fillScreen/drawFastHLine and text output via a built-in 5x7 font (uppercase letters, digits, basic punctuation). Inherits from Print, so print()/println() with all standard overloads (including F() flash strings) work out of the box.
